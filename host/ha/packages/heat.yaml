# Heating: gas boiler versus an all-electric heat pump (docs/warmtepomp.md). Deployed by host/ha/setup_heat.py
# as packages/heat.yaml (through martha-ha, so it is in the config repository); setup_heat.py
# fills in the weather entity (__WEATHER__). All functions and tables: host/db/heat.sql.
#
# The SQL sensors read the recorder's database (no db_url) and poll every 30 seconds, so they
# only read stored results or cheap functions. The running totals (state_class total) become
# long-term statistics; the dashboards Verwarming and Tapwater show their change per day, week, month,
# year or a chosen period. They lag up to ~5 minutes (heat_job). A changed model parameter
# recomputes all history, so a total can jump once.

template:
  - sensor:
      # The outdoor temperature from the weather integration, as a sensor so LTSS stores it
      # (heat_temperature reads it from ltss_1m). Without internet it is unavailable; the
      # calculation then uses Open-Meteo history or the reference year.
      - name: Buitentemperatuur
        unique_id: heat_outdoor_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: "{{ state_attr('__WEATHER__', 'temperature') }}"
        availability: "{{ state_attr('__WEATHER__', 'temperature') is number }}"

# Gas market price per hour from EnergyZero (day-ahead, EUR/m³, without taxes or markup), for
# the comparison at market prices. The attribute Prices (the last 3 days and tomorrow) goes
# through LTSS into the table heat_gas_market (trigger heat_capture), so missed hours are
# filled in on the next successful fetch. Without internet the sensor is unavailable.
rest:
  - resource_template: >-
      https://api.energyzero.nl/v1/energyprices?fromDate={{ (utcnow() - timedelta(days=3)).strftime('%Y-%m-%dT00:00:00.000Z') }}&tillDate={{ (utcnow() + timedelta(days=1)).strftime('%Y-%m-%dT23:59:59.999Z') }}&interval=4&usageType=3&inclBtw=false
    scan_interval: 3600
    timeout: 30
    sensor:
      - name: Gasprijs markt
        unique_id: heat_gas_market
        unit_of_measurement: EUR/m³
        icon: mdi:meter-gas
        value_template: >-
          {% set hour = utcnow().strftime('%Y-%m-%dT%H:00:00Z') %}
          {{ value_json.Prices | selectattr('readingDate', 'eq', hour) | map(attribute='price') | first | default(none) }}
        json_attributes:
          - Prices

sql:
  # --- Running totals since the first gas data -------------------------------------------
  - name: Warmtepomp kosten CV-ketel
    unique_id: heat_total_cv
    icon: mdi:fire
    unit_of_measurement: EUR
    device_class: monetary
    state_class: total
    column: v
    query: SELECT round(cv::numeric, 4) AS v, round(cv_var::numeric, 2) AS energie FROM heat_totals() LIMIT 1;

  - name: Warmtepomp kosten warmtepomp
    unique_id: heat_total_wp
    icon: mdi:heat-pump-outline
    unit_of_measurement: EUR
    device_class: monetary
    state_class: total
    column: v
    query: SELECT round(wp::numeric, 4) AS v, round(wp_var::numeric, 2) AS energie FROM heat_totals() LIMIT 1;

  - name: Warmtepomp kosten CV-ketel marktprijs
    unique_id: heat_total_cv_mkt
    icon: mdi:fire
    unit_of_measurement: EUR
    device_class: monetary
    state_class: total
    column: v
    query: SELECT round(cv_mkt::numeric, 4) AS v FROM heat_totals() LIMIT 1;

  - name: Warmtepomp kosten warmtepomp marktprijs
    unique_id: heat_total_wp_mkt
    icon: mdi:heat-pump-outline
    unit_of_measurement: EUR
    device_class: monetary
    state_class: total
    column: v
    query: SELECT round(wp_mkt::numeric, 4) AS v FROM heat_totals() LIMIT 1;

  - name: Warmtepomp warmtevraag
    unique_id: heat_total_heat
    icon: mdi:radiator
    unit_of_measurement: kWh
    device_class: energy
    state_class: total
    column: v
    query: SELECT round(heat::numeric, 3) AS v FROM heat_totals() LIMIT 1;

  - name: Warmtepomp stroom warmtepomp
    unique_id: heat_total_wp_kwh
    icon: mdi:lightning-bolt
    unit_of_measurement: kWh
    device_class: energy
    state_class: total
    column: v
    query: SELECT round(wp_kwh::numeric, 3) AS v FROM heat_totals() LIMIT 1;

  - name: Warmtepomp gas warm water
    unique_id: heat_total_gas_dhw
    icon: mdi:shower-head
    unit_of_measurement: m³
    device_class: gas
    state_class: total
    column: v
    query: SELECT round(gas_dhw::numeric, 3) AS v FROM heat_totals() LIMIT 1;

  # --- Results (heat_results, hourly) ----------------------------------------------------
  - name: Warmtepomp besparing per jaar
    unique_id: heat_forecast
    icon: mdi:calendar-cash
    unit_of_measurement: EUR
    column: v
    # The state is the saving per year of the heat pump at contract prices; the table is an attribute.
    query: >-
      SELECT round(f.value::numeric) AS v,
             f.detail AS tabel,
             (SELECT round(value::numeric) FROM heat_result WHERE key = 'year_cost_cv') AS kosten_cv,
             (SELECT round(value::numeric) FROM heat_result WHERE key = 'year_cost_wp') AS kosten_warmtepomp,
             (SELECT round(value::numeric) FROM heat_result WHERE key = 'year_cost_cv_mkt') AS kosten_cv_marktprijs,
             (SELECT round(value::numeric) FROM heat_result WHERE key = 'year_cost_wp_mkt') AS kosten_warmtepomp_marktprijs,
             (SELECT round(value::numeric) FROM heat_result WHERE key = 'year_gas_m3') AS gas_per_jaar,
             (SELECT round(value::numeric, 2) FROM heat_result WHERE key = 'year_scop') AS scop,
             to_char(f.updated AT TIME ZONE 'Europe/Amsterdam', 'YYYY-MM-DD HH24:MI') AS berekend
      FROM heat_result f WHERE f.key = 'forecast' LIMIT 1;

  - name: Warmtepomp warmteverlies
    unique_id: heat_loss
    icon: mdi:home-thermometer-outline
    unit_of_measurement: W/K
    column: v
    query: >-
      SELECT round(f.value::numeric) AS v, f.detail AS toelichting,
             (SELECT round(value::numeric, 2) FROM heat_result WHERE key = 'required_kw') AS vermogen_bij_min10_kw,
             (SELECT round(value::numeric, 2) FROM heat_result WHERE key = 'dhw_per_day') AS warm_water_m3_per_dag
      FROM heat_result f WHERE f.key = 'fit' LIMIT 1;

  # --- Explanation and assumptions (markdown in an attribute) ------------------------------
  - name: Warmtepomp berekening
    unique_id: heat_explain
    icon: mdi:calculator-variant-outline
    column: v
    query: >-
      SELECT to_char(shown AT TIME ZONE 'Europe/Amsterdam', 'YYYY-MM-DD HH24:MI') AS v, md AS uitleg
      FROM heat_explain() LIMIT 1;

  - name: Warmtepomp aannames
    unique_id: heat_assumptions
    icon: mdi:clipboard-list-outline
    column: v
    # The state is the number of parameters still at their default.
    query: SELECT defaults AS v, md AS tabel FROM heat_assumptions() LIMIT 1;
