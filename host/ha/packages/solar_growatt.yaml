# Growatt MIN 3000TL-XH through Modbus TCP on its ShineLink (docs/zonnepanelen.md, Z6).
# Deployed by host/ha/setup_solar.py --inverter as packages/solar_growatt.yaml (through
# martha-ha put_files). The host is the fixed IP address of the ShineLink, in secrets.yaml
# (martha_growatt_host); setup_solar.py writes it from /etc/martha/inverter.
#
# Input registers 0-124 of the Growatt Modbus protocol (unit 1): power and energy are 0.1 W
# and 0.1 kWh, voltage, current and temperature 0.1, frequency 0.01. At night the inverter is
# off and the sensors are unavailable. LTSS stores the sensors; host/db/solar.sql uses the
# power and the total (roles pv_power and pv_total, by unique_id).

modbus:
  - name: growatt
    type: tcp
    host: !secret martha_growatt_host
    port: 502
    timeout: 5
    sensors:
      - name: Growatt vermogen
        unique_id: solar_growatt_power
        device_address: 1
        input_type: input
        address: 35          # Pac, AC output power
        data_type: uint32
        scale: 0.1
        precision: 1
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        scan_interval: 10
      - name: Growatt opwek vandaag
        unique_id: solar_growatt_energy_today
        device_address: 1
        input_type: input
        address: 53          # Eac today
        data_type: uint32
        scale: 0.1
        precision: 1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        scan_interval: 30
      - name: Growatt opwek totaal
        unique_id: solar_growatt_energy_total
        device_address: 1
        input_type: input
        address: 55          # Eac total
        data_type: uint32
        scale: 0.1
        precision: 1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        scan_interval: 30
      - name: Growatt string 1 spanning
        unique_id: solar_growatt_pv1_voltage
        device_address: 1
        input_type: input
        address: 3
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
        scan_interval: 30
      - name: Growatt string 1 stroom
        unique_id: solar_growatt_pv1_current
        device_address: 1
        input_type: input
        address: 4
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        scan_interval: 30
      - name: Growatt string 2 spanning
        unique_id: solar_growatt_pv2_voltage
        device_address: 1
        input_type: input
        address: 7
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
        scan_interval: 30
      - name: Growatt string 2 stroom
        unique_id: solar_growatt_pv2_current
        device_address: 1
        input_type: input
        address: 8
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        scan_interval: 30
      - name: Growatt netfrequentie
        unique_id: solar_growatt_frequency
        device_address: 1
        input_type: input
        address: 37
        data_type: uint16
        scale: 0.01
        precision: 2
        unit_of_measurement: Hz
        device_class: frequency
        state_class: measurement
        scan_interval: 30
      - name: Growatt netspanning
        unique_id: solar_growatt_grid_voltage
        device_address: 1
        input_type: input
        address: 38
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
        scan_interval: 30
      - name: Growatt temperatuur
        unique_id: solar_growatt_temperature
        device_address: 1
        input_type: input
        address: 93
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: °C
        device_class: temperature
        state_class: measurement
        scan_interval: 30
      - name: Growatt statuscode
        unique_id: solar_growatt_status_code
        device_address: 1
        input_type: input
        address: 0
        data_type: uint16
        scan_interval: 30

template:
  - sensor:
      - name: Growatt status
        unique_id: solar_growatt_status
        default_entity_id: sensor.solar_growatt_status
        icon: mdi:information-outline
        # Growatt: 0 waiting, 1 normal, 3 fault; unavailable at night, when the inverter is off.
        state: >-
          {% set c = states('sensor.growatt_statuscode') %}
          {% if c in ('unavailable', 'unknown') %}uit
          {% else %}{{ {0: 'wachten', 1: 'normaal', 3: 'storing'}.get(c | int(-1), 'code ' ~ c) }}{% endif %}
